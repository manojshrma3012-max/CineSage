[project]
name = "lang-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manoj", email = "manojshrma3012@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain",
    "langchain-community",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-openai",
    "langgraph",
    "pydantic>=2.13.4",
    "python-dotenv",
    "streamlit>=1.62.0",
]

[project.scripts]
lang-tutorial = "lang_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
